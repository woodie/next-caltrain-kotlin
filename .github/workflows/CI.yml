name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # kwick has no published artifact yet -- settings.gradle.kts's
      # includeBuild("../kwick") needs it checked out as a real sibling
      # directory. `path: ../kwick` is relative to $GITHUB_WORKSPACE, so this
      # lands exactly at that sibling path -- same trick kotidy's consumers
      # used before it was published to the Gradle Plugin Portal. Drop this
      # step once kwick ships a real Maven Central release and
      # app/build.gradle.kts pins a version instead.
      - name: Checkout kwick
        uses: actions/checkout@v4
        with:
          repository: woodie/kwick
          path: ../kwick

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
          java-version: "21"

      - name: Run tests
        # Kotest DescribeSpec classes run on the plain JVM (MockK stands in
        # for Context/SharedPreferences) -- no emulator/instrumented tests
        # here, so ubuntu-latest's pre-installed Android SDK is enough to
        # satisfy compileSdk without an emulator step.
        run: ./gradlew clean test
